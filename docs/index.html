<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="soundtrack" content="Pixel Daydream — original 200 BPM chiptune, included in game data"><title>Let's go live!</title><style>
html,body{margin:0;width:100%;height:100%;background:#080308;overflow:hidden}#canvas{display:block;outline:none;width:100%;height:100%}#loading{position:fixed;inset:0;display:grid;place-content:center;text-align:center;color:#ffb9e4;background:#080308;font:14px monospace;gap:24px;padding:24px}#loading:before{content:"ON AIR / SAYO";color:#ff43b8;letter-spacing:5px;font-size:12px}#loading strong{color:#ff43b8;font-size:clamp(26px,6vw,42px);padding:30px 24px;border:2px solid #ff43b8;box-shadow:8px 8px 0 #501033;text-shadow:3px 3px 0 #501033}#label{letter-spacing:2px;font-size:12px}progress{appearance:none;width:min(360px,80vw);height:12px;justify-self:center;border:1px solid #ff43b8;background:#210c19;accent-color:#ff43b8}progress::-webkit-progress-bar{background:#210c19}progress::-webkit-progress-value{background:#ff43b8}progress::-moz-progress-bar{background:#ff43b8}#error{max-width:600px;color:#ffb9e4;overflow-wrap:anywhere}button{background:#210c19;color:#ffb9e4;padding:12px;border:1px solid #ff43b8}
</style></head><body><canvas id="canvas" tabindex="0" aria-label="Let's go live! game. Up and down to switch tracks, Enter to start, Escape to pause, M to mute."></canvas><div id="loading"><strong>Let's go live!</strong><span id="label">CONNECTING TO SAYO'S STREAM...</span><progress id="progress"></progress><span id="error"></span></div><script src="index.js"></script><script>
const engine=new Engine({"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":29174372,"index.wasm":38034280},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4});const loading=document.getElementById('loading');
engine.startGame({onProgress:(current,total)=>{const p=document.getElementById('progress');if(total){p.max=total;p.value=current;}document.getElementById('label').textContent='LOADING STREAM... '+(total?Math.round(current/total*100)+'%':'');}}).then(()=>{loading.style.display='none';document.getElementById('canvas').focus();}).catch(error=>{document.getElementById('label').textContent='STREAM COULD NOT START';document.getElementById('error').textContent=String(error);});
</script></body></html>
